[tool.ruff]
target-version = "py312"
line-length = 120
builtins = ["dbutils", "spark"]

lint.select = [
    "B",    # flake8-bugbear
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "NPY",  # NumPy
    "PTH",  # flake8-use-pathlib
    "UP",   # pyupgrade
]

lint.ignore = [
    "N812",   # Allow `import pyspark.sql.functions as F`
    "PTH123", # Allow native `open()`
]

lint.isort.known-first-party = ["core", "config"]
lint.pydocstyle.convention = "numpy"