bundle:
  name: "data_engine"
  uuid: "your-unique-uuid" # Replace with a unique UUID for your bundle

# Artifacts
artifacts:
  default:
    type: whl
    build: python -m build
    path: "."

# Sync Exclusions
sync:
  exclude:
    - .venv*/
    - .git*/
    - build/
    - dist/
    - "*.egg-info/"
    - __pycache__/
    - "*.pyc"

# Included Workflow & Resource Files
include:
  - resources/*.yml
  - resources/jobs/common_trigger_sample.jobs.yml
  - resources/jobs/job_compute_sample.jobs.yml
  - resources/jobs/manage_entities.jobs.yml
  - resources/jobs/serverless_compute_sample.jobs.yml

# Variables
variables:
  # Default Job Compute Cluster
  default_job_cluster:
    description: Default cluster configuration
    type: complex
    default:
      spark_version: "17.3.x-scala2.13"
      node_type_id: "Standard_DS3_v2"
      autoscale:
        min_workers: 1
        max_workers: 4
      runtime_engine: PHOTON
      data_security_mode: SINGLE_USER
      policy_id: ${var.job_cluster_policy_id}
      enable_elastic_disk: true
      spark_conf:
        spark.databricks.io.cache.enabled: "true"
        spark.databricks.delta.optimizeWrite.enabled: "true"
      azure_attributes:
        first_on_demand: 1
        availability: SPOT_WITH_FALLBACK_AZURE
        spot_bid_max_price: 100
      custom_tags:
        project: engine

  # Shared Libraries (wheels) to be installed on clusters
  engine_shared_libraries:
    default:
      - whl: ./dist/*.whl
