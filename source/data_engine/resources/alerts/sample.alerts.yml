resources:
  alerts:
    sample_alert_key: # This is a reference key for the alert configuration.
      display_name: "sample-alert-${var.env}"
      warehouse_id: "${var.sql_warehouse_id}"

      # Query aggregates today's DQ errors by product / table / check.
      # Returns a single row so all Mustache columns are available in the notification.
      query_text: |-
        SELECT * FROM (  
        SELECT
        col1,
        col2,
        COUNT(DISTINCT col3) AS cnt
        FROM ${var.silver_catalog}.sample_schema.sample_table
        WHERE col1 = ''
        GROUP BY col1, col2
        )
        ORDER BY cnt DESC

      custom_summary: "" # This is a custom summary for the alert notification. It can include Mustache variables from the query result.

      custom_description: |-
        <div style="font-family: Arial, sans-serif; font-size: 14px; color: #333333; line-height: 1.5;">
        <p>Hi Team,</p>
        <p><b>bold_txt</b> normal_txt <code>${var.silver_catalog}.sample_schema.sample_table</code>.</p>

        <h4 style="margin-bottom: 8px; color: #d9534f;">Validation Details</h4>
        <div style="border: 1px solid #e0e0e0; border-radius: 4px; padding: 12px; background-color: #f9f9f9;">
          {{QUERY_RESULT_TABLE}}
        </div>

        <p style="margin-top: 16px;">more_txt.</p>
        <br/>
        <p>Regards,<br/><b>Team Name</b></p>
        </div>

      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: cnt
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          # Re-alerts after every run if errors are still present.
          retrigger_seconds: 1
          subscriptions:
            - user_email: "alerts@company.com"

      schedule:
        # Schedule is paused — alert only runs via the job task.
        quartz_cron_schedule: "0 0 6 * * ?"
        timezone_id: "America/New_York"
        pause_status: PAUSED
